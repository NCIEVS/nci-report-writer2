#
# Spring Properties
#
spring:
    #
    # Application Properties
    #
    application:
        name: reportwriter-program

    #
    # Just an non-web application
    #
    main:
        web-environment: false
        banner-mode: "off"


# Logging Properties
#
logging:
    file: ${LOG_FILE:rw_report.log}
    level:
        org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:ERROR}
        gov.nih.nci.evs.rw: ${LOGGING_LEVEL_GOV_NIH_NCI_EVS_RW:INFO}
    pattern:
      file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
      console: ""

gov:
  nih:
    nci:
      evs:
       reportwriter:
         core:
           templateDirectory: ${RW_TEMPLATE_DIRECTORY:/tmp/templates}
           outputDirectory: ${RW_OUTPUT_DIRECTORY:/tmp/output}
         graphdb:
           monthlyQueryUrl: ${GRAPHDB_MONTHLY_QUERY_URL:http://localhost:5820/NCIT2/query}
           monthlyGraphName: ${GRAPHDB_MONTHLY_GRAPH_NAME:http://NCI_T}
           weeklyQueryUrl: ${GRAPHDB_WEEKLY_QUERY_URL:http://localhost:5820/NCIT2/query}
           weeklyGraphName: ${GRAPHDB_WEEKLY_GRAPH_NAME:http://NCI_T}
           username: ${GRAPHDB_USERNAME:admin}
           password: ${GRAPHDB_PASSWORD:admin}
           readTimeout: ${GRAPHDB_READ_TIMEOUT:10000}
           connectTimeout: ${GRAPHDB_CONNECT_TIMEOUT:10000}