buildscript {
	ext {
		springBootVersion = '3.5.14'
	}
    repositories {  
        mavenLocal()    
        mavenCentral() 
        maven { url "https://repo.spring.io/release" }
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
       
    }

    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

// properties
ext {
    // software version
    jacksonVersion = "2.21.4"
    mysqlConnectorVersion = "8.4.0"
    tomcatVersion = "10.1.55"
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'war'
apply plugin: 'org.springframework.boot'
/*
 * The dependency management plugin remains a transitive dependency of spring-boot-gradle-plugin
 * so there’s no need for it to be listed as a classpath dependency in the buildscript configuration.
 */
apply plugin: 'io.spring.dependency-management'
apply plugin: 'maven-publish'

group = "gov.nih.nci.evs.reportwriter"
version = "2.5.0.RELEASE"
sourceCompatibility = 17


springBoot {
    buildInfo()          // generate file META-INF/build-info.properties during the build
}

repositories {
    mavenLocal()  
    mavenCentral() 
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    
    implementation "org.springframework.boot:spring-boot-starter-data-rest"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-actuator"
    implementation "org.springframework.boot:spring-boot-devtools"
    implementation "org.springframework.boot:spring-boot-properties-migrator"
    
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    // Security override: Spring Boot 3.5.14 currently resolves Jackson 2.21.2,
    // which Trivy flags for high-severity jackson-core and jackson-databind CVEs.
    // Keep the Jackson family pinned to a fixed patch release until the Boot BOM catches up.
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"

    // Security override: Spring Boot 3.5.14 currently resolves embedded Tomcat 10.1.54,
    // which Trivy flags for high/critical tomcat-embed-core CVEs.
    // Pin the embedded Tomcat modules together so the servlet container stays version-aligned.
    implementation "org.apache.tomcat.embed:tomcat-embed-core:$tomcatVersion"
    implementation "org.apache.tomcat.embed:tomcat-embed-el:$tomcatVersion"
    implementation "org.apache.tomcat.embed:tomcat-embed-websocket:$tomcatVersion"
    implementation "org.apache.tomcat:tomcat-annotations-api:$tomcatVersion"
    implementation "com.mysql:mysql-connector-j:$mysqlConnectorVersion"
    
    // Apache POI for Excel processing
    implementation "org.apache.poi:poi:5.2.5"
    implementation "org.apache.poi:poi-ooxml:5.2.5"
    implementation "org.apache.poi:poi-scratchpad:5.2.5"

    // test dependencies
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.awaitility:awaitility:4.2.2"
}

bootWar {
    archivesBaseName = 'ncireportwriter2'
}

test {
    /*
     * Configure gradle to show standard out and standard error
     * of the test JVM(s) on the console
     */
    testLogging.showStandardStreams = true   
}

// Archive zip file
task zipFile(type: Zip) {
    // explicit override of ${project.name} which resolves to "web" due to subproject gradle setup
    def zipFileRootDirectory = "ncireportwriter2-${project.version}"

    from('src/main/bin') {
        fileMode = 0755
        into "$zipFileRootDirectory/bin"
    }
    from("$buildDir/libs") {
        include '*.war'
        into "$zipFileRootDirectory/lib"
    }
    rename { String fileName ->
        fileName.replace("-${project.version}", "")
    }
}

test {
    useJUnitPlatform()
}

zipFile.dependsOn = [ bootWar ]
build.dependsOn = [ test, bootWar, zipFile ]
publish.dependsOn = [ bootWar, zipFile ]


dependencyLocking {
    lockAllConfigurations()
}
