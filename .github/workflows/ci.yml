name: Angular Jest Tests
on:
  push:
    branches:
      - develop # the primary branch
  pull_request:
    branches:
      - develop # the primary branch
jobs:
  run-jest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '19' #set the project Angular version
      - name: Install Dependencies
        run: npm install
      - name: Build Application
        run: make build # change to command that builds the project
      - name: Run Jest Tests
        run: make test # change to command that tests the project
