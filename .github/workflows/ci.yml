name: Tests
on:
  push:
    branches:
      - develop # the primary branch
  pull_request:
    branches:
      - develop # the primary branch
permissions:
    contents: read
    pull-requests: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: bash ./gradlew --no-daemon build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: web/build/reports/tests/
  run-jest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '19' #set the project Angular version
      - name: Install Dependencies
        run: npm install
      - name: Build Application
        run: ./gradlew build # change to command that builds the project
      - name: Run Jest Tests
        run: npm run test # change to command that tests the project
