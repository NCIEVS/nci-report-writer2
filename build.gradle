plugins {
    id 'java'
}

allprojects {
    group = 'gov.nih.nci.evs.reportwriter'
    version = '2.3.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}